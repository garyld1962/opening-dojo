name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dojo
          POSTGRES_PASSWORD: dojo
          POSTGRES_DB: opening_dojo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dojo -d opening_dojo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://dojo:dojo@localhost:5432/opening_dojo?schema=public
      # The coach route requires these to be configured; the e2e test stubs the
      # transport, so no model server is contacted in CI.
      OLLAMA_BASE_URL: http://localhost:11434
      OLLAMA_MODEL: llama3.1:8b
      DEMO_USER_ID: 00000000-0000-0000-0000-000000000001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      - run: pnpm exec prisma db seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
